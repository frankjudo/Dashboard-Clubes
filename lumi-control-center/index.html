<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LUMI — Control Center</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#181c18}
    #app{width:100%;height:100%;border:0;display:block;background:#181c18}
    #loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-family:Arial,sans-serif;background:#181c18}
    #loading small{display:block;color:#aeb5ac;margin-top:8px;text-align:center}
  </style>
</head>
<body>
  <div id="loading"><div>LUMI Control Center<small>Carregando a base v21…</small></div></div>
  <iframe id="app" title="LUMI Control Center"></iframe>
  <script>
    const SOURCE='https://wfiuqoiycnftzhimewri.supabase.co/storage/v1/object/public/lumi-static/index.html';
    const IMPORT_MAP={imports:{
      'react':'https://esm.sh/react@19.2.8',
      'react-dom':'https://esm.sh/react-dom@19.2.8',
      'react/jsx-runtime':'https://esm.sh/react@19.2.8/jsx-runtime',
      'react-dom/client':'https://esm.sh/react-dom@19.2.8/client'
    }};
    (async()=>{
      try{
        const res=await fetch(SOURCE,{cache:'no-store'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        let html=await res.text();
        if(!/^<!doctype html>/i.test(html.trim())) throw new Error('HTML inválido');
        const mapTag='<scr'+'ipt type="importmap">'+JSON.stringify(IMPORT_MAP)+'</scr'+'ipt>';
        html=html.replace('<script type="module">',mapTag+'<script type="module">');
        const frame=document.getElementById('app');
        frame.srcdoc=html;
        frame.addEventListener('load',()=>document.getElementById('loading')?.remove(),{once:true});
      }catch(err){
        document.getElementById('loading').innerHTML='<div>Não foi possível carregar o LUMI.<small>'+String(err)+'</small></div>';
      }
    })();
  </script>
</body>
</html>
