<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMI — Estoque Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f5f3ee;--panel:#fff;--ink:#171b17;--muted:#747c75;--dark:#171d19;--gold:#c58a3d;--green:#dcebdd;--line:#e5e0d7;--warn:#fff4df}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,Arial,sans-serif;color:var(--ink)}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--dark);color:#fff;padding:22px 16px;display:flex;flex-direction:column}.logo{font-weight:800;letter-spacing:.2em;margin:4px 6px 28px}.logo small{display:block;font-size:8px;letter-spacing:.15em;color:#a8afa9;margin-top:4px}.nav{display:grid;gap:8px}.nav a{color:#c8cec9;text-decoration:none;padding:12px;border-radius:10px}.nav a.active{background:#2a302b;color:#fff;border-left:3px solid var(--gold)}.who{margin-top:auto;border-top:1px solid #ffffff18;padding-top:16px}.who strong,.who small{display:block}.who small{color:#9ea69f;font-size:11px;margin-top:4px}.main{padding:0 28px 32px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin:0 -28px 20px;padding:0 28px;background:#faf9f6}.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;cursor:pointer;font-weight:650}.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.card small{color:var(--muted)}.card strong{display:block;font-size:22px;margin-top:7px}.hero{background:linear-gradient(135deg,#1c241e,#2c392f);color:#fff;border-radius:16px;padding:22px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:14px}.hero h2{margin:0 0 7px}.hero p{margin:0;color:#c9d2cb}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.toolbar{display:flex;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--line)}.search{padding:10px 12px;border:1px solid var(--line);border-radius:9px;min-width:250px}.row,.head{display:grid;grid-template-columns:minmax(260px,2fr) .55fr .55fr .55fr .8fr .8fr 105px;gap:12px;align-items:center;padding:12px 16px}.head{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#899088;background:#f6f4ef}.row{border-top:1px solid #eeeae3}.row.low{background:var(--warn)}.prod strong,.prod small{display:block}.prod small{color:var(--muted);font-size:11px;margin-top:4px}.modal{position:fixed;inset:0;background:#1118;display:none;place-items:center;padding:18px}.modal.show{display:grid}.box{width:min(640px,100%);background:#fff;border-radius:16px;padding:20px}.boxhead{display:flex;justify-content:space-between}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.actions button{padding:10px 8px;border:1px solid var(--line);background:#f7f5f0;border-radius:9px;cursor:pointer}.actions button.active{border-color:var(--gold);background:#f7ead8;color:#8a581d;font-weight:700}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea{padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.field textarea{min-height:70px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.msg{margin:10px 0;padding:10px;border-radius:8px;background:#f4efe5}.login{max-width:420px;margin:100px auto;background:#fff;padding:26px;border-radius:16px;border:1px solid var(--line)}.login input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid var(--line);border-radius:9px}.history{margin-top:14px}.history-list{max-height:240px;overflow:auto}.hist{display:grid;grid-template-columns:1fr .8fr .5fr 1fr;gap:10px;padding:10px 14px;border-top:1px solid #eeeae3;font-size:12px}.hist small{color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:0 12px 24px}.top{margin:0 -12px 14px;padding:0 12px}.cards{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.row,.head{grid-template-columns:minmax(160px,2fr) .6fr .6fr .6fr 90px}.row>*:nth-child(5),.row>*:nth-child(6),.head>*:nth-child(5),.head>*:nth-child(6){display:none}.actions{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="root"></div><div id="modal" class="modal"></div><script>
const URL='https://wfiuqoiycnftzhimewri.supabase.co', KEY='sb_publishable_9F4HiApJgfZB3pMS0J9cPg_PA0cH37U';
const client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); let rows=[], selected=null, action='receive';
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
async function start(){const {data:{session}}=await client.auth.getSession(); if(!session) return renderLogin(); const {data:admin}=await client.from('app_admins').select('display_name,role,is_active').eq('email',session.user.email).maybeSingle(); if(!admin?.is_active){await client.auth.signOut();return renderLogin('Acesso não autorizado.')} renderApp(session,admin); await load();}
function renderLogin(msg=''){root.innerHTML=`<div class="login"><h2>LUMI Control Center</h2><p>Área administrativa de estoque</p>${msg?`<div class="msg">${msg}</div>`:''}<label>E-mail<input id="email" type="email"></label><label>Senha<input id="pass" type="password"></label><button class="btn primary" style="width:100%" onclick="login()">Entrar</button></div>`}
async function login(){const {error}=await client.auth.signInWithPassword({email:email.value,password:pass.value}); if(error)return renderLogin(error.message==='Invalid login credentials'?'E-mail ou senha incorretos.':error.message);start()}
function renderApp(session,admin){root.innerHTML=`<div class="shell"><aside class="side"><div class="logo">◇ LUMI<small>CONTROL CENTER</small></div><nav class="nav"><a href="./">Visão geral</a><a href="./">Produtos</a><a href="./">Compras</a><a class="active">Estoque</a><a href="./">Preço & margem</a><a href="./">Radar de fornecedores</a></nav><div class="who"><strong>${admin.display_name} · ADMIN</strong><small>${session.user.email}</small><button class="btn" style="margin-top:10px" onclick="logout()">Sair</button></div></aside><main class="main"><header class="top"><div><h1>Estoque</h1><p>Controle operacional de entradas, reservas, baixas e conferências.</p></div><button class="btn" onclick="load()">↻ Atualizar</button></header><div id="content"></div></main></div>`}
async function load(){const [{data:r,error:e},{data:h}]=await Promise.all([client.from('v_product_performance').select('*').order('name'),client.from('inventory_adjustments').select('id,adjustment_type,quantity,qty_before,qty_after,note,actor_email,created_at,products(name,sku)').order('created_at',{ascending:false}).limit(40)]);if(e){content.innerHTML=`<div class="msg">${e.message}</div>`;return}rows=r||[];renderStock(h||[])}
function renderStock(history){const on=rows.reduce((a,b)=>a+b.qty_on_hand,0),av=rows.reduce((a,b)=>a+b.qty_available,0),res=rows.reduce((a,b)=>a+b.qty_reserved,0),low=rows.filter(x=>x.qty_available<=2).length,val=rows.reduce((a,b)=>a+b.qty_on_hand*Number(b.avg_landed_cost_brl),0);content.innerHTML=`<div class="cards"><div class="card"><small>Em mãos</small><strong>${on} un.</strong></div><div class="card"><small>Disponíveis</small><strong>${av} un.</strong></div><div class="card"><small>Reservadas</small><strong>${res} un.</strong></div><div class="card"><small>Pedem atenção</small><strong>${low}</strong></div><div class="card"><small>Capital no estoque</small><strong>${money(val)}</strong></div></div><section class="hero"><div><h2>Estoque sem complicação.</h2><p>Registre o que aconteceu fisicamente. O sistema atualiza as quantidades e guarda quem fez cada movimentação.</p></div><button class="btn" onclick="document.getElementById('q').focus()">Buscar produto</button></section><section class="panel"><div class="toolbar"><div><strong>Produtos e disponibilidade</strong><div style="color:#747c75;font-size:11px;margin-top:4px">Clique em Movimentar para alterar o estoque</div></div><input id="q" class="search" placeholder="Buscar produto ou SKU" oninput="filterRows()"></div><div class="head"><span>Produto</span><span>Em mãos</span><span>Reservado</span><span>Disponível</span><span>Custo médio</span><span>Valor</span><span></span></div><div id="table">${stockRows(rows)}</div></section><section class="panel history"><div class="toolbar"><strong>Últimas movimentações</strong><span style="color:#747c75;font-size:11px">Auditoria por usuário</span></div><div class="history-list">${history.map(x=>`<div class="hist"><div><strong>${x.products?.name||'Produto'}</strong><small>${x.products?.sku||''}</small></div><span>${label(x.adjustment_type)}</span><strong>${x.quantity}</strong><div><span>${x.actor_email||'sistema'}</span><small>${new Date(x.created_at).toLocaleString('pt-BR')}</small></div></div>`).join('')||'<div style="padding:14px">Nenhuma movimentação manual ainda.</div>'}</div></section>`}
function stockRows(list){return list.map((x,i)=>`<div class="row ${x.qty_available<=2?'low':''}"><div class="prod"><strong>${x.name}${x.qty_available<=2?' · estoque baixo':''}</strong><small>${x.sku} · ${x.category}</small></div><strong>${x.qty_on_hand}</strong><span>${x.qty_reserved}</span><strong>${x.qty_available}</strong><span>${money(x.avg_landed_cost_brl)}</span><strong>${money(x.qty_on_hand*x.avg_landed_cost_brl)}</strong><button class="btn" onclick="openMove('${x.product_id}')">Movimentar</button></div>`).join('')}
function filterRows(){const s=q.value.toLowerCase();table.innerHTML=stockRows(rows.filter(x=>(x.name+' '+x.sku+' '+x.category).toLowerCase().includes(s)))}
function label(a){return({receive:'Entrada',set_count:'Contagem',reserve:'Reserva',release:'Liberação',sale:'Baixa/Venda',damage:'Avaria',return:'Devolução',correction:'Correção'})[a]||a}
function openMove(id){selected=rows.find(x=>x.product_id===id);action='receive';modal.className='modal show';modal.innerHTML=`<div class="box"><div class="boxhead"><div><small>Movimentação de estoque</small><h3>${selected.name}</h3><span>${selected.sku} · Em mãos ${selected.qty_on_hand} · Disponível ${selected.qty_available}</span></div><button class="btn" onclick="closeMove()">✕</button></div><div class="actions" id="acts">${['receive','set_count','reserve','release','sale','damage','return'].map(a=>`<button class="${a===action?'active':''}" onclick="setAction('${a}')">${label(a)}</button>`).join('')}</div><label class="field">Quantidade<input id="qty" type="number" min="0" value="1"></label><label class="field">Observação<textarea id="note" placeholder="Ex.: conferência física, cliente, motivo da avaria..."></textarea></label><div id="fmsg"></div><div class="foot"><button class="btn" onclick="closeMove()">Cancelar</button><button class="btn primary" onclick="applyMove()">Confirmar movimentação</button></div></div>`}
function setAction(a){action=a;openMove(selected.product_id);document.getElementById('qty').value=1}
function closeMove(){modal.className='modal';modal.innerHTML='';selected=null}
async function applyMove(){const quantity=Math.max(0,Number(qty.value)||0);const {error}=await client.rpc('inventory_apply_adjustment',{p_product_id:selected.product_id,p_type:action,p_quantity:quantity,p_note:note.value||null});if(error){fmsg.innerHTML=`<div class="msg">${error.message}</div>`;return}fmsg.innerHTML='<div class="msg">Estoque atualizado com sucesso.</div>';setTimeout(async()=>{closeMove();await load()},500)}
async function logout(){await client.auth.signOut();renderLogin()}
start();
</script></body></html>
