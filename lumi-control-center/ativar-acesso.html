<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMI — Ativar acesso</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#171d19;color:#171b17;font:15px Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,92vw);background:#fff;border-radius:18px;padding:26px;box-shadow:0 20px 60px #0003}.logo{font-weight:800;letter-spacing:.18em;color:#171d19}.logo small{display:block;font-size:8px;color:#8c948d;margin-top:4px}.card h1{font-size:24px;margin:26px 0 8px}.card p{color:#6d756e;line-height:1.5}.field{display:grid;gap:6px;margin:14px 0}.field input{padding:12px;border:1px solid #dedbd3;border-radius:10px;font:inherit}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#171d19;color:#fff;font-weight:700;cursor:pointer}.msg{margin:14px 0;padding:11px 12px;border-radius:10px;background:#f4efe5}.ok{background:#e4f1e5;color:#24552c}.bad{background:#fff0ec;color:#8a2b1b}.muted{font-size:12px;color:#899087;margin-top:12px}</style></head><body><div class="card"><div class="logo">◇ LUMI<small>CONTROL CENTER</small></div><h1>Ativar acesso ADMIN</h1><p id="intro">Validando seu acesso seguro…</p><div id="msg"></div><div id="form" style="display:none"><label class="field">Nova senha<input id="p1" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></label><label class="field">Confirmar senha<input id="p2" type="password" minlength="8" autocomplete="new-password"></label><button class="btn" onclick="savePassword()">Definir senha e entrar</button><div class="muted">Depois disso você poderá usar esta senha normalmente no LUMI Control Center.</div></div></div><script>const SB_URL='https://wfiuqoiycnftzhimewri.supabase.co',SB_KEY='sb_publishable_9F4HiApJgfZB3pMS0J9cPg_PA0cH37U';const client=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});const qs=new URLSearchParams(location.search);const token=qs.get('token_hash');function show(text,cls=''){msg.innerHTML='<div class="msg '+cls+'">'+text+'</div>'}async function boot(){let {data:{session}}=await client.auth.getSession();if(!session&&token){const {error}=await client.auth.verifyOtp({token_hash:token,type:'recovery'});if(error){show('Este link expirou ou já foi usado. Peça um novo acesso.','bad');intro.textContent='Não foi possível validar o link.';return}({data:{session}}=await client.auth.getSession())}if(!session){show('Link sem sessão válida. Peça um novo acesso.','bad');intro.textContent='Não foi possível validar o link.';return}const {data:admin,error}=await client.from('app_admins').select('display_name,role,is_active').eq('email',session.user.email).maybeSingle();if(error||!admin?.is_active||admin.role!=='admin'){await client.auth.signOut();show('Seu usuário não está liberado como ADMIN.','bad');intro.textContent='Acesso não autorizado.';return}intro.textContent='Olá, '+(admin.display_name||'ADMIN')+'. Seu acesso foi validado.';show('Conta confirmada. Agora defina sua senha.','ok');form.style.display='block'}async function savePassword(){if(p1.value.length<8){show('Use uma senha com pelo menos 8 caracteres.','bad');return}if(p1.value!==p2.value){show('As duas senhas não conferem.','bad');return}const {error}=await client.auth.updateUser({password:p1.value});if(error){show(error.message,'bad');return}show('Senha definida com sucesso. Abrindo o Estoque…','ok');setTimeout(()=>location.replace('./estoque-operacao.html'),900)}boot();</script></body></html>
